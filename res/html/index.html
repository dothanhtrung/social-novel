{% include "include/head.html" %}

    {% raw %}<script>
        let userMap = {};
        let userList = [];
        let usernameMapLower = {}; // map lowercase username -> user
        let currentGroup = null;
        let groupAvatarRev = Date.now();

        function groupAvatarUrl(id) {
            return `/data/avatar/${id}.png?v=${groupAvatarRev}`;
        }
        function groupCoverUrl(id) {
            return `/data/cover/${id}.png?v=${groupAvatarRev}`;
        }
        async function fetchUsers() {
            try {
                const res = await fetch("/api/character");
                const data = await res.json();
                if (data.characters) {
                    userMap = {};
                    userList = data.characters;
                    for (const user of data.characters) {
                        userMap[user.id] = user;
                        if (user.username) usernameMapLower[user.username.toLowerCase()] = user;
                    }
                    rememberCharacters(data.characters);
                }
            } catch (e) {
                userMap = {};
                userList = [];
            }
        }


        let friendList = [];
        let openFriend = null;

        function friendPreview(friend, meId) {
            if (!friend.last_at && !(friend.last_message || '').trim()) return 'No messages yet';
            const text = (friend.last_message || '').trim() || 'Media';
            const prefix = Number(friend.last_author) === Number(meId) ? 'You: ' : '';
            const line = prefix + text;
            return line.length > 42 ? line.slice(0, 41) + '\u2026' : line;
        }

        async function renderContacts() {
            const contactsContainer = document.querySelector("[data-contacts-list]");
            if (!contactsContainer) return;
            const me = getMainCharacter();
            if (!me || !me.id) {
                friendList = [];
                contactsContainer.innerHTML = '<div class="px-2 py-2 text-[14px] text-fb-gray-text">Select a character first</div>';
                return;
            }
            try {
                const res = await fetch('/api/friend?character=' + encodeURIComponent(me.id));
                const data = await res.json();
                if (data.err) {
                    contactsContainer.innerHTML = '<div class="text-red-500 px-2">' + escapeHtml(data.err) + '</div>';
                    return;
                }
                friendList = data.friends || [];
                if (friendList.length === 0) {
                    contactsContainer.innerHTML = '<div class="px-2 py-2 text-[14px] text-fb-gray-text">No friends yet</div>';
                    return;
                }
                contactsContainer.innerHTML = friendList.map((friend) => `
                    <button type="button" class="friend-row w-full flex items-center gap-3 px-2 py-2 rounded-lg hover:bg-fb-hover transition-colors text-left" data-friend-id="${friend.id}">
                        <div class="size-9 rounded-full bg-cover bg-center shrink-0 bg-[#E4E6EB]" style="background-image: url('${getAvatarUrl(friend)}')"></div>
                        <div class="min-w-0 flex-1">
                            <div class="text-[15px] font-semibold truncate">${escapeHtml(friend.name || friend.username)}</div>
                            <div class="text-[13px] text-fb-gray-text truncate">${escapeHtml(friendPreview(friend, me.id))}</div>
                        </div>
                    </button>
                `).join('');
                if (openFriend) {
                    const still = friendList.find((f) => Number(f.id) === Number(openFriend.id));
                    if (still) openFriend = still;
                }
            } catch (e) {
                contactsContainer.innerHTML = '<div class="text-red-500 px-2">Failed to load contacts</div>';
            }
        }

        function closeFriendChat() {
            openFriend = null;
            const popup = document.getElementById('friend-chat');
            if (popup) {
                popup.classList.add('hidden');
                popup.classList.remove('flex');
            }
        }

        async function loadFriendMessages(roomId) {
            const box = document.getElementById('friend-chat-messages');
            if (!box) return;
            if (!roomId) {
                box.innerHTML = '<div class="text-center text-fb-gray-text text-[13px] mt-6">Say hi to start a chat</div>';
                return;
            }
            try {
                const res = await fetch(`/api/post?room=${roomId}&count=50`);
                const data = await res.json();
                if (data.err) {
                    box.innerHTML = '<div class="text-red-500 text-[13px] px-2">' + escapeHtml(data.err) + '</div>';
                    return;
                }
                const posts = (data.posts || []).slice().reverse();
                const meId = getMainCharacterId();
                if (posts.length === 0) {
                    box.innerHTML = '<div class="text-center text-fb-gray-text text-[13px] mt-6">Say hi to start a chat</div>';
                    return;
                }
                box.innerHTML = posts.map((p) => {
                    const mine = String(p.author) === String(meId);
                    return `<div class="flex ${mine ? 'justify-end' : 'justify-start'}">
                        <div class="max-w-[80%] px-3 py-1.5 rounded-2xl text-[15px] break-words ${mine ? 'bg-fb-blue text-white' : 'bg-white text-[#050505]'}">${renderContentWithMentions(p.content || '')}</div>
                    </div>`;
                }).join('');
                box.scrollTop = box.scrollHeight;
            } catch (e) {
                box.innerHTML = '<div class="text-red-500 text-[13px] px-2">Failed to load messages</div>';
            }
        }

        async function openFriendChat(friend) {
            openFriend = friend;
            const popup = document.getElementById('friend-chat');
            if (!popup) return;
            popup.classList.remove('hidden');
            popup.classList.add('flex');
            document.getElementById('friend-chat-name').textContent = friend.name || friend.username || '';
            const avatar = document.getElementById('friend-chat-avatar');
            const url = getAvatarUrl(friend);
            avatar.style.backgroundImage = url ? `url('${url}')` : '';
            await loadFriendMessages(friend.room_id);
            const input = document.getElementById('friend-chat-input');
            if (input) input.focus();
        }

        async function ensureFriendRoom(friend) {
            if (friend.room_id) return friend.room_id;
            const me = getMainCharacter();
            if (!me || !me.username || !friend.username) {
                throw new Error('Missing username');
            }
            const formData = new FormData();
            formData.append('id', '0');
            formData.append('name', friend.name || friend.username);
            formData.append('members', me.username + ',' + friend.username);
            const res = await fetch('/api/room', { method: 'POST', body: formData });
            const data = await res.json();
            if (data.err) throw new Error(data.err);
            if (!data.id) throw new Error('Room was not created');
            friend.room_id = data.id;
            return data.id;
        }

        async function sendFriendMessage(content) {
            const me = getMainCharacter();
            if (!me || !openFriend) {
                alert('Select a character first');
                return;
            }
            const roomId = await ensureFriendRoom(openFriend);
            const formData = new FormData();
            formData.append('id', '0');
            formData.append('content', content);
            formData.append('author', String(me.id));
            formData.append('parent', '0');
            formData.append('liked', '0');
            formData.append('haha', '0');
            formData.append('loved', '0');
            formData.append('surprised', '0');
            formData.append('sad', '0');
            formData.append('feeling', '');
            formData.append('is_with', '');
            formData.append('liked_by', '');
            formData.append('group', '0');
            formData.append('room', String(roomId));
            const res = await fetch('/api/post', { method: 'POST', body: formData });
            const data = await res.json();
            if (data.err) throw new Error(data.err);
            await loadFriendMessages(roomId);
            await renderContacts();
        }

        function setAddFriendOpen(open) {
            const dropdown = document.getElementById('add-friend-dropdown');
            if (!dropdown) return;
            dropdown.classList.toggle('hidden', !open);
            if (open) {
                const search = document.getElementById('add-friend-search');
                if (search) {
                    search.value = '';
                    search.focus();
                }
                renderAddFriendList('');
            }
        }

        function renderAddFriendList(query) {
            const list = document.getElementById('add-friend-list');
            if (!list) return;
            const me = getMainCharacter();
            const q = (query || '').trim().toLowerCase();
            const taken = new Set(friendList.map((f) => Number(f.id)));
            if (me) taken.add(Number(me.id));
            const matches = (userList || []).filter((c) => {
                if (taken.has(Number(c.id))) return false;
                if (!q) return true;
                return (c.username || '').toLowerCase().includes(q) || (c.name || '').toLowerCase().includes(q);
            });
            if (matches.length === 0) {
                list.innerHTML = '<div class="px-3 py-4 text-[13px] text-fb-gray-text">No characters found</div>';
                return;
            }
            list.innerHTML = matches.map((c) => `
                <button type="button" class="add-friend-option w-full flex items-center gap-3 px-3 py-2 hover:bg-fb-hover text-left" data-character-id="${c.id}">
                    <div class="size-8 rounded-full bg-cover bg-center shrink-0 bg-[#E4E6EB]" style="background-image: url('${getAvatarUrl(c)}')"></div>
                    <div class="min-w-0">
                        <div class="text-[15px] font-semibold truncate">${escapeHtml(c.name || c.username)}</div>
                        <div class="text-[13px] text-fb-gray-text truncate">@${escapeHtml(c.username || '')}</div>
                    </div>
                </button>
            `).join('');
        }

        async function addFriend(friendId) {
            const me = getMainCharacter();
            if (!me || !me.id) {
                alert('Select a character first');
                return;
            }
            const res = await fetch('/api/friend', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ character: Number(me.id), friend: Number(friendId) }),
            });
            const data = await res.json();
            if (data.err) {
                alert(data.err);
                return;
            }
            setAddFriendOpen(false);
            await renderContacts();
        }

        async function unfriendOpen() {
            const me = getMainCharacter();
            if (!me || !openFriend) return;
            const name = openFriend.name || openFriend.username || 'this character';
            if (!confirm('Remove ' + name + ' from friends?')) return;
            const res = await fetch(`/api/friend/delete?character=${me.id}&friend=${openFriend.id}`);
            const data = await res.json();
            if (data.err) {
                alert(data.err);
                return;
            }
            closeFriendChat();
            await renderContacts();
        }

        function initFriendChat() {
            const contacts = document.querySelector('[data-contacts-list]');
            if (contacts) {
                contacts.addEventListener('click', (e) => {
                    const row = e.target.closest('.friend-row');
                    if (!row) return;
                    const friend = friendList.find((f) => Number(f.id) === Number(row.dataset.friendId));
                    if (friend) openFriendChat(friend);
                });
            }
            const closeBtn = document.getElementById('friend-chat-close');
            if (closeBtn) closeBtn.addEventListener('click', closeFriendChat);
            const unfriendBtn = document.getElementById('friend-unfriend');
            if (unfriendBtn) unfriendBtn.addEventListener('click', unfriendOpen);
            const form = document.getElementById('friend-chat-form');
            if (form) {
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const input = document.getElementById('friend-chat-input');
                    const content = input ? input.value.trim() : '';
                    if (!content) return;
                    try {
                        await sendFriendMessage(content);
                        if (input) input.value = '';
                    } catch (err) {
                        alert(err.message || String(err));
                    }
                });
            }
            const addBtn = document.getElementById('add-friend-btn');
            const dropdown = document.getElementById('add-friend-dropdown');
            const search = document.getElementById('add-friend-search');
            const addList = document.getElementById('add-friend-list');
            if (addBtn) {
                addBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const willOpen = !dropdown || dropdown.classList.contains('hidden');
                    setAddFriendOpen(willOpen);
                });
            }
            if (search) {
                search.addEventListener('click', (e) => e.stopPropagation());
                search.addEventListener('input', () => renderAddFriendList(search.value));
            }
            if (addList) {
                addList.addEventListener('click', (e) => {
                    const opt = e.target.closest('.add-friend-option');
                    if (!opt) return;
                    addFriend(opt.dataset.characterId);
                });
            }
            document.addEventListener('click', (e) => {
                if (dropdown && !dropdown.classList.contains('hidden')) {
                    const picker = document.getElementById('add-friend-picker');
                    if (picker && !picker.contains(e.target)) setAddFriendOpen(false);
                }
            });
        }

        function currentGroupId() {
            const id = Number(document.body && document.body.dataset.groupId);
            return Number.isFinite(id) && id > 0 ? id : 0;
        }

        // Feed query keeps pagination params and, on a group page, only root posts of that group.
        function feedQuery() {
            const {page, count} = getPageParams();
            const params = new URLSearchParams(window.location.search);
            params.set('page', String(page));
            params.set('count', String(count));
            const groupId = currentGroupId();
            if (groupId > 0) {
                params.set('group', String(groupId));
                params.set('roots', 'true');
            } else {
                params.delete('group');
                params.delete('roots');
            }
            return params;
        }

        async function renderPosts() {
            const postsContainer = document.querySelector("[data-posts-list]");
            if (!postsContainer) return;
            const {page, count} = getPageParams();
            const groupId = currentGroupId();
            const roots = await loadAndRenderPosts({
                container: postsContainer,
                query: feedQuery(),
                emptyHtml: groupId > 0
                    ? '<div class="bg-white rounded-lg shadow-sm border border-gray-200 p-8 text-center text-fb-gray-text">No posts in this group yet</div>'
                    : '',
            });
            if (roots) renderPager(roots.length, page, count);
        }


        // Render pagination controls. We don't have total posts from API, so allow next until empty result.
        function renderPager(returnedCount, page, count) {
            // Ensure a pager container exists after posts list
            let pager = document.getElementById('posts-pager');
            if (!pager) {
                pager = document.createElement('div');
                pager.id = 'posts-pager';
                pager.className = 'w-full flex items-center justify-center py-4';
                const postsList = document.querySelector('[data-posts-list]');
                if (postsList && postsList.parentElement) postsList.parentElement.appendChild(pager);
            }

            // If returnedCount is 0 and page > 1, we are past last page — move back
            if (returnedCount === 0 && page > 1) {
                // Go back one page silently
                page = Math.max(1, page - 1);
                updateUrlParams(page, count);
                // refetch
                renderPosts();
                return;
            }

            const isFirst = page <= 1;
            // If returnedCount < count, we assume this is the last page
            const isLast = returnedCount < count;

            pager.innerHTML = `
            <div class="flex items-center gap-2">
                <button id="pager-first" class="px-3 py-1 rounded border bg-white hover:bg-fb-hover" ${isFirst ? 'disabled' : ''}>First</button>
                <button id="pager-prev" class="px-3 py-1 rounded border bg-white hover:bg-fb-hover" ${isFirst ? 'disabled' : ''}>Prev</button>
                <div class="px-3">Page <strong>${page}</strong></div>
                <button id="pager-next" class="px-3 py-1 rounded border bg-white hover:bg-fb-hover" ${isLast ? 'disabled' : ''}>Next</button>
                <button id="pager-last" class="px-3 py-1 rounded border bg-white hover:bg-fb-hover" ${isLast ? 'disabled' : ''}>Last</button>
            </div>
        `;

            // Attach handlers
            pager.querySelector('#pager-first').addEventListener('click', () => {
                if (isFirst) return;
                updateUrlParams(1, count);
                renderPosts();
            });
            pager.querySelector('#pager-prev').addEventListener('click', () => {
                if (isFirst) return;
                const np = Math.max(1, page - 1);
                updateUrlParams(np, count);
                renderPosts();
            });
            pager.querySelector('#pager-next').addEventListener('click', () => {
                if (isLast) return;
                const np = page + 1;
                updateUrlParams(np, count);
                renderPosts();
            });
            pager.querySelector('#pager-last').addEventListener('click', async () => {
                // Try to find last page by exponential/backoff search
                // Start from current page and double until we get empty result
                let low = 1, high = page;
                // find a high that returns less than count (or empty)
                while (true) {
                    const q = feedQuery();
                    q.set('page', String(high));
                    q.set('count', String(count));
                    const r = await fetch('/api/post?' + q.toString());
                    const d = await r.json().catch(() => ({}));
                    const got = (d.posts && d.posts.length) || 0;
                    if (got === 0) break;
                    if (got < count) {
                        low = high;
                        break;
                    }
                    low = high;
                    high = high * 2;
                    // avoid runaway
                    if (high > 10000) break;
                }
                // binary search between low and high to find last non-empty
                let lo = low, hi = Math.max(high, low + 1);
                while (lo + 1 < hi) {
                    const mid = Math.floor((lo + hi) / 2);
                    const q = feedQuery();
                    q.set('page', String(mid));
                    q.set('count', String(count));
                    const r = await fetch('/api/post?' + q.toString());
                    const d = await r.json().catch(() => ({}));
                    const got = (d.posts && d.posts.length) || 0;
                    if (got === 0) {
                        hi = mid;
                    } else {
                        lo = mid;
                    }
                    if (hi - lo <= 1) break;
                }
                const lastPage = Math.max(1, lo);
                updateUrlParams(lastPage, count);
                renderPosts();
            });
        }

        function showGroupSidebar(on) {
            const home = document.getElementById('home-groups-panel');
            const side = document.getElementById('group-sidebar-panel');
            if (home) home.classList.toggle('hidden', on);
            if (side) side.classList.toggle('hidden', !on);
        }

        function paintJoinButton(btn, joined) {
            if (!btn) return;
            const me = getMainCharacter();
            if (!me || !me.id) {
                btn.classList.add('hidden');
                return;
            }
            btn.classList.remove('hidden');
            btn.dataset.joined = joined ? '1' : '0';
            btn.textContent = joined ? 'Leave' : 'Join';
            btn.className = joined
                ? 'shrink-0 px-4 py-1.5 rounded-lg font-semibold text-[15px] bg-[#E4E6EB] text-[#050505] hover:bg-[#D8DADF]'
                : 'shrink-0 px-4 py-1.5 rounded-lg font-semibold text-[15px] bg-fb-blue text-white hover:bg-[#166fe5]';
            if (btn.id === 'group-side-join') btn.classList.add('mt-3', 'w-full', 'py-2');
        }

        async function characterJoined(groupId) {
            const me = getMainCharacter();
            if (!me || !me.id || !groupId) return false;
            const res = await fetch('/api/group?member=' + encodeURIComponent(me.id));
            const data = await res.json();
            return (data.groups || []).some((g) => Number(g.id) === Number(groupId));
        }

        async function setGroupMembership(groupId, join) {
            const me = getMainCharacter();
            if (!me || !me.id) {
                alert('Select a character first');
                return;
            }
            const path = join ? 'join' : 'leave';
            const res = await fetch(`/api/group/${path}?character=${me.id}&group=${groupId}`, {
                method: join ? 'POST' : 'GET',
            });
            const data = await res.json();
            if (data.err) throw new Error(data.err);
        }

        async function renderGroupMembers(groupId) {
            const list = document.getElementById('group-member-list');
            if (!list) return;
            try {
                const res = await fetch('/api/group/members?group=' + encodeURIComponent(groupId));
                const data = await res.json();
                const members = data.members || [];
                if (members.length === 0) {
                    list.innerHTML = '<div class="px-2 py-2 text-[14px] text-fb-gray-text">No members yet</div>';
                    return;
                }
                list.innerHTML = members.map((m) => `
                    <a class="flex items-center gap-3 px-2 py-2 rounded-lg hover:bg-fb-hover transition-colors" href="/u/${encodeURIComponent(m.username || '')}">
                        <div class="size-9 rounded-full bg-cover bg-center shrink-0 bg-[#E4E6EB]" style="background-image: url('${getAvatarUrl(m)}')"></div>
                        <span class="text-[15px] font-semibold truncate">${escapeHtml(m.name || m.username)}</span>
                    </a>
                `).join('');
            } catch (e) {
                list.innerHTML = '<div class="px-2 text-red-500 text-[14px]">Failed to load members</div>';
            }
        }

        async function refreshGroupMembership() {
            const groupId = currentGroupId();
            if (groupId <= 0) return;
            const joined = await characterJoined(groupId);
            paintJoinButton(document.getElementById('group-join-btn'), joined);
            paintJoinButton(document.getElementById('group-side-join'), joined);
            await renderGroupMembers(groupId);
        }

        async function onGroupMembershipClick(e) {
            const groupId = currentGroupId();
            if (groupId <= 0) return;
            const joined = e.currentTarget.dataset.joined === '1';
            if (joined && !confirm('Leave this group?')) return;
            try {
                await setGroupMembership(groupId, !joined);
                await refreshGroupMembership();
                renderGroups();
            } catch (err) {
                alert(err.message || String(err));
            }
        }

        async function renderGroups() {
            const groupId = currentGroupId();
            showGroupSidebar(groupId > 0);
            async function fetchGroups() {
                const me = getMainCharacter();
                if (!me || !me.id) return [];
                try {
                    const res = await fetch('/api/group?member=' + encodeURIComponent(me.id));
                    const data = await res.json();
                    if (data.err) {
                        console.error('Failed to fetch groups:', data.err);
                        return [];
                    }
                    return data.groups || [];
                } catch (err) {
                    console.error('Error fetching groups:', err);
                    return [];
                }
            }

            const groups = await fetchGroups();
            const container = document.getElementById('groups-container');
            if (!container) return;
            const selectedId = groupId;
            if (groups.length === 0) {
                const me = getMainCharacter();
                container.innerHTML = '<div class="px-2 py-2 text-[14px] text-fb-gray-text">'
                    + (me && me.id ? 'No groups yet' : 'Select a character first')
                    + '</div>';
                return;
            }
            container.innerHTML = '';
            for (const group of groups) {
                const selected = Number(group.id) === selectedId;
                const a = document.createElement('a');
                a.href = `/g/${group.id}`;
                a.dataset.groupId = String(group.id);
                a.className = selected
                    ? 'group-link flex items-center gap-3 px-2 py-2 rounded-lg bg-[#E7F3FF] text-fb-blue transition-colors'
                    : 'group-link flex items-center gap-3 px-2 py-2 rounded-lg hover:bg-fb-hover transition-colors';
                if (selected) a.setAttribute('aria-current', 'page');
                const div = document.createElement('div');
                div.className = 'size-9 rounded-lg bg-cover bg-center bg-[#E4E6EB]';
                div.style.backgroundImage = `url('${groupAvatarUrl(group.id)}')`;
                const span = document.createElement('span');
                span.className = selected ? 'text-[15px] font-bold' : 'text-[15px] font-semibold';
                span.textContent = group.name;
                a.appendChild(div);
                a.appendChild(span);
                container.appendChild(a);
                if (selected) {
                    const scroller = container.closest('aside');
                    if (scroller) {
                        const itemTop = a.getBoundingClientRect().top;
                        const box = scroller.getBoundingClientRect();
                        if (itemTop < box.top || itemTop > box.bottom) {
                            scroller.scrollTop += itemTop - box.top - 8;
                        }
                    }
                }
            }
        }

        function handlePhotoVideo() {
            const btn = document.getElementById('photo-video-btn');
            const input = document.getElementById('media-input');
            btn.addEventListener('click', () => input.click());
            input.addEventListener('change', function () {
                const preview = document.getElementById('media-preview');
                preview.innerHTML = '';
                for (const file of input.files) {
                    const url = URL.createObjectURL(file);
                    let el;
                    if (file.type.startsWith('image/')) {
                        el = document.createElement('img');
                        el.src = url;
                        el.className = 'w-20 h-20 object-cover rounded-lg';
                    } else if (file.type.startsWith('video/')) {
                        el = document.createElement('video');
                        el.src = url;
                        el.className = 'w-20 h-20 object-cover rounded-lg';
                        el.controls = true;
                    }
                    if (el) preview.appendChild(el);
                }
            });
        }

        function handleFeeling() {
            const btn = document.getElementById('feeling-btn');
            const input = document.getElementById('feeling-input');
            btn.addEventListener('click', () => {
                input.classList.toggle('hidden');
                if (!input.classList.contains('hidden')) input.focus();
            });
        }

        function handleAddFeedForm() {
            const form = document.getElementById('add-feed-form');
            form.addEventListener('submit', async function (e) {
                e.preventDefault();
                const formData = new FormData(form);
                const authorId = getMainCharacterId();
                if (!authorId) {
                    alert('Please select a character from the header first.');
                    return;
                }
                formData.set('author', authorId);
                if (!formData.get('content')) {
                    alert('Content cannot be empty.');
                    return;
                }
                // Attach all selected media files
                const mediaInput = document.getElementById('media-input');
                formData.delete('media');
                for (const file of mediaInput.files) {
                    formData.append('media', file);
                }
                // Add default values for other fields required by backend
                formData.set('id', '0');
                formData.set('parent', '0');
                formData.set('liked', '0');
                formData.set('haha', '0');
                formData.set('loved', '0');
                formData.set('surprised', '0');
                formData.set('sad', '0');
                formData.set('liked_by', '');
                formData.set('group', String(currentGroupId()));
                formData.set('room', '0');
                const isWithVal = document.getElementById('is-with-input') ? document.getElementById('is-with-input').value : '';
                formData.set('is_with', isWithVal);
                try {
                    for (var pair of formData.entries()) {
                        console.log(pair[0]+ ', ' + pair[1]); 
                    }
                    const res = await fetch('/api/post', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await res.json();
                    if (data.err) {
                        alert('Failed to post: ' + data.err);
                    } else {
                        form.reset();
                        applyMainCharacter(getMainCharacter());
                        document.getElementById('media-preview').innerHTML = '';
                        document.getElementById('feeling-input').classList.add('hidden');
                        renderPosts();
                    }
                } catch (err) {
                    alert('Failed to post: ' + err);
                }
            });
        }

        async function renderSponsored() {
            const container = document.querySelector("[data-sponsored-list]");
            if (!container) return;
            try {
                const res = await fetch("/api/admin/sponsored?active=true");
                const data = await res.json();
                const ads = data.ads || [];
                if (ads.length === 0) {
                    container.innerHTML = "";
                    return;
                }
                container.innerHTML = ads.map(ad => {
                    const title = escapeHtml(ad.description || "");
                    let media = '<div class="size-28 rounded-lg bg-fb-hover shrink-0"></div>';
                    if (ad.media && isVideoMedia(ad.media)) {
                        media = `<video src="${escapeHtml(ad.media)}" class="size-28 rounded-lg object-cover shrink-0 bg-black" muted loop playsinline></video>`;
                    } else if (ad.media) {
                        media = `<div class="size-28 rounded-lg bg-cover bg-center shrink-0" style="background-image: url('${escapeHtml(ad.media)}');"></div>`;
                    }
                    return `<div class="flex items-center gap-3 p-2 rounded-lg hover:bg-fb-hover group">
                        ${media}
                        <div class="flex flex-col justify-center min-w-0">
                            <h4 class="text-[15px] font-semibold text-[#050505]">${title}</h4>
                        </div>
                    </div>`;
                }).join("");
            } catch (e) {
                container.innerHTML = "";
            }
        }

        function setGroupModalMode(mode) {
            const title = document.getElementById('group-form-title');
            const submit = document.getElementById('group-form-submit');
            const idInput = document.getElementById('group-form-id');
            const nameInput = document.getElementById('group-form-name');
            const descInput = document.getElementById('group-form-description');
            const avatarInput = document.getElementById('group-form-avatar');
            const preview = document.getElementById('group-avatar-preview');
            const coverInput = document.getElementById('group-form-cover');
            const coverPreview = document.getElementById('group-cover-preview');
            const editing = mode === 'edit' && currentGroup;
            if (editing) {
                if (title) title.textContent = 'Edit Group';
                if (submit) submit.textContent = 'Save';
                if (idInput) idInput.value = String(currentGroup.id);
                if (nameInput) nameInput.value = currentGroup.name || '';
                if (descInput) descInput.value = currentGroup.description || '';
                if (avatarInput) avatarInput.value = '';
                if (preview) preview.style.backgroundImage = `url('${groupAvatarUrl(currentGroup.id)}')`;
                if (coverInput) coverInput.value = '';
                if (coverPreview) coverPreview.style.backgroundImage = `url('${groupCoverUrl(currentGroup.id)}')`;
            } else {
                if (title) title.textContent = 'Create New Group';
                if (submit) submit.textContent = 'Create Group';
                if (idInput) idInput.value = '0';
                if (nameInput) nameInput.value = '';
                if (descInput) descInput.value = '';
                if (avatarInput) avatarInput.value = '';
                if (preview) preview.style.backgroundImage = '';
                if (coverInput) coverInput.value = '';
                if (coverPreview) coverPreview.style.backgroundImage = '';
            }
        }

        function initGroupHandlers() {
            const addBtn = document.getElementById('add-group-btn');
            const editBtn = document.getElementById('edit-group-btn');
            const modal = document.getElementById('group-create-modal');
            const cancelBtn = document.getElementById('group-cancel');
            const form = document.getElementById('group-form');
            const avatarInput = document.getElementById('group-form-avatar');
            const preview = document.getElementById('group-avatar-preview');
            const coverInput = document.getElementById('group-form-cover');
            const coverPreview = document.getElementById('group-cover-preview');

            if (!addBtn || !modal || !cancelBtn || !form) return;

            function openModal(mode) {
                setGroupModalMode(mode);
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            }

            function closeModal() {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                setGroupModalMode('create');
            }

            addBtn.addEventListener('click', () => openModal('create'));
            if (editBtn) editBtn.addEventListener('click', () => openModal('edit'));
            cancelBtn.addEventListener('click', closeModal);
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });

            if (avatarInput && preview) {
                avatarInput.addEventListener('change', () => {
                    const file = avatarInput.files && avatarInput.files[0];
                    if (!file) return;
                    preview.style.backgroundImage = `url('${URL.createObjectURL(file)}')`;
                });
            }
            if (coverInput && coverPreview) {
                coverInput.addEventListener('change', () => {
                    const file = coverInput.files && coverInput.files[0];
                    if (!file) return;
                    coverPreview.style.backgroundImage = `url('${URL.createObjectURL(file)}')`;
                });
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData(form);
                const editing = Number(formData.get('id')) > 0;
                const avatar = formData.get('avatar');
                if (!avatar || !avatar.name) formData.delete('avatar');
                const cover = formData.get('cover');
                if (!cover || !cover.name) formData.delete('cover');

                try {
                    const res = await fetch('/api/group', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await res.json();

                    if (data.err) {
                        alert((editing ? 'Failed to save group: ' : 'Failed to create group: ') + data.err);
                    } else {
                        if (!editing && data.id) {
                            const me = getMainCharacter();
                            if (me && me.id) {
                                await setGroupMembership(data.id, true).catch(() => {});
                            }
                        }
                        if (!editing) alert('Group created successfully!');
                        groupAvatarRev = Date.now();
                        closeModal();
                        renderGroups();
                        renderGroupHeader();
                    }
                } catch (err) {
                    alert((editing ? 'Failed to save group: ' : 'Failed to create group: ') + err);
                }
            });
        }
        

        async function renderGroupHeader() {
            const header = document.getElementById('group-page-header');
            if (!header) return;
            const groupId = currentGroupId();
            const postingIn = document.getElementById('posting-in');
            const composer = document.getElementById('post-content');
            const editBtn = document.getElementById('edit-group-btn');
            if (groupId <= 0) {
                currentGroup = null;
                header.classList.add('hidden');
                if (editBtn) editBtn.classList.add('hidden');
                if (postingIn) postingIn.classList.add('hidden');
                if (composer) composer.placeholder = "What's on your mind?";
                return;
            }
            header.classList.remove('hidden');
            const nameEl = document.getElementById('group-page-name');
            const descEl = document.getElementById('group-page-desc');
            const avatarEl = document.getElementById('group-page-avatar');
            const coverEl = document.getElementById('group-page-cover');
            try {
                const res = await fetch('/api/group');
                const data = await res.json();
                const group = (data.groups || []).find((g) => Number(g.id) === groupId);
                if (!group) {
                    currentGroup = null;
                    if (editBtn) editBtn.classList.add('hidden');
                    if (nameEl) nameEl.textContent = 'Group not found';
                    if (descEl) {
                        descEl.textContent = '';
                        descEl.classList.add('hidden');
                    }
                    document.title = 'Group not found - Social Novel';
                    return;
                }
                currentGroup = group;
                if (editBtn) editBtn.classList.remove('hidden');
                const avatarUrl = groupAvatarUrl(group.id);
                if (nameEl) nameEl.textContent = group.name || 'Group';
                if (descEl) {
                    descEl.textContent = group.description || '';
                    descEl.classList.toggle('hidden', !group.description);
                }
                if (avatarEl) avatarEl.style.backgroundImage = `url('${avatarUrl}')`;
                if (coverEl) {
                    coverEl.style.backgroundImage = `url('${groupCoverUrl(group.id)}')`;
                }
                if (composer) composer.placeholder = `Write something to ${group.name || 'this group'}...`;
                if (postingIn) {
                    postingIn.textContent = group.name ? `Posting in ${group.name}` : 'Posting in this group';
                    postingIn.classList.remove('hidden');
                }
                document.title = `${group.name || 'Group'} - Social Novel`;
                const sideName = document.getElementById('group-side-name');
                const sideDesc = document.getElementById('group-side-desc');
                const sideAvatar = document.getElementById('group-side-avatar');
                if (sideName) sideName.textContent = group.name || 'Group';
                if (sideDesc) sideDesc.textContent = group.description || '';
                if (sideAvatar) sideAvatar.style.backgroundImage = `url('${avatarUrl}')`;
                await refreshGroupMembership();
            } catch (e) {
                currentGroup = null;
                if (editBtn) editBtn.classList.add('hidden');
                if (nameEl) nameEl.textContent = 'Failed to load group';
            }
        }

        window.addEventListener("DOMContentLoaded", async () => {
            await fetchUsers();
            renderGroups();
            renderGroupHeader();
            renderContacts();
            initFriendChat();
            renderSponsored();
            renderPosts();
            handlePhotoVideo();
            handleFeeling();
            handleAddFeedForm();
            initGroupHandlers();
            const joinBtn = document.getElementById('group-join-btn');
            const sideJoin = document.getElementById('group-side-join');
            if (joinBtn) joinBtn.addEventListener('click', onGroupMembershipClick);
            if (sideJoin) sideJoin.addEventListener('click', onGroupMembershipClick);
        });

        document.addEventListener('main-character-change', () => {
            closeFriendChat();
            renderContacts();
            renderGroups();
            refreshGroupMembership();
        });
    </script>{% endraw %}
</head>
